name: Daily News Push

on:
  schedule:
    # 每天北京时间 07:30 执行（UTC cron: 30 23 * * *）
    - cron: '30 23 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  push-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news push
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TOPICS: "大模型与基础技术,AIGC工具与多模态,AI智能体与行业落地,行业动态与商业政策,优秀AI视频案例与创作者生态"
        run: |
          python scripts/news_bot.py --once --topics "大模型与基础技术,AIGC工具与多模态,AI智能体与行业落地,行业动态与商业政策,优秀AI视频案例与创作者生态"
